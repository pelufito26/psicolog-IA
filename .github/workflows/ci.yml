name: Calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Controles de calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener revisión
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Fijar npm
        run: npm install --global npm@11.13.0
      - name: Mostrar versiones
        run: |
          node --version
          npm --version
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npm run build
